<!DOCTYPE html>
<html>
<head>
    <title>썸네일 테스트</title>
    <style>
        body { background: #1e293b; color: white; padding: 20px; font-family: sans-serif; }
        button { padding: 15px 30px; background: #fb923c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px; }
        button:hover { background: #f97316; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        pre { background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; }
        .thumbnail-image { max-width: 100%; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); margin: 20px 0; }
        .loading { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <h1>🎨 썸네일 API 테스트</h1>
    <div>
        <button onclick="testThumbnailPrompt()">1. 프롬프트만 생성</button>
        <button onclick="testThumbnailWithImage()" id="generateBtn">2. 이미지 생성 (데모)</button>
    </div>
    <div id="result"></div>

    <script>
        // 프롬프트만 생성하는 테스트
        async function testThumbnailPrompt() {
            const result = document.getElementById('result');
            result.innerHTML = '<p class="loading">⏳ 프롬프트 생성 중...</p>';
            
            try {
                console.log('API 호출 시작...');
                const response = await fetch('/api/style/generate-thumbnail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: '듣는 순간 집중되는 음악📚',
                        style: 'Lo-Fi Hip Hop, study music',
                        language: 'korean',
                        generateImage: false
                    })
                });
                
                console.log('응답 받음:', response.status);
                const data = await response.json();
                console.log('데이터:', data);
                
                if (data.success) {
                    let html = '<h2>✅ 프롬프트 생성 성공!</h2>';
                    html += `
                        <p><strong>분위기:</strong> ${data.config.mood}</p>
                        <p><strong>색상:</strong> ${data.config.colorScheme}</p>
                        <p><strong>시각 요소:</strong> ${data.config.visualElements}</p>
                        <details>
                            <summary>📝 생성된 프롬프트 보기</summary>
                            <pre>${data.prompt}</pre>
                        </details>
                    `;
                    result.innerHTML = html;
                } else {
                    result.innerHTML = `<h2>❌ 실패</h2><p>${data.error}</p>`;
                }
            } catch (error) {
                console.error('에러:', error);
                result.innerHTML = `<h2>❌ 에러</h2><p>${error.message}</p>`;
            }
        }

        // 이미지를 직접 생성하는 데모 (GenSpark image_generation 사용)
        async function testThumbnailWithImage() {
            const result = document.getElementById('result');
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            result.innerHTML = '<p class="loading">⏳ 이미지 생성 중... (최대 1분 소요)</p>';
            
            try {
                // 1단계: 프롬프트 생성
                console.log('1단계: 프롬프트 생성 중...');
                const promptResponse = await fetch('/api/style/generate-thumbnail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: '듣는 순간 집중되는 음악📚',
                        style: 'Lo-Fi Hip Hop, study music',
                        language: 'korean',
                        generateImage: false
                    })
                });
                
                const promptData = await promptResponse.json();
                console.log('프롬프트 생성 완료:', promptData);
                
                if (!promptData.success) {
                    throw new Error('프롬프트 생성 실패');
                }
                
                // 2단계: 데모 이미지 표시 (실제로는 GenSpark API 호출)
                result.innerHTML = `
                    <h2>✅ 이미지 생성 완료!</h2>
                    <div style="margin: 20px 0;">
                        <img src="https://www.genspark.ai/api/files/s/8QFgydlO?cache_control=3600" 
                             alt="Generated Thumbnail" 
                             class="thumbnail-image">
                    </div>
                    <p><strong>✨ 이미지 URL:</strong> <a href="https://www.genspark.ai/api/files/s/8QFgydlO?cache_control=3600" target="_blank" style="color: #fb923c;">링크 열기</a></p>
                    <p><strong>분위기:</strong> ${promptData.config.mood}</p>
                    <p><strong>색상:</strong> ${promptData.config.colorScheme}</p>
                    <p><strong>시각 요소:</strong> ${promptData.config.visualElements}</p>
                    <details>
                        <summary>📝 사용된 프롬프트 보기</summary>
                        <pre>${promptData.prompt}</pre>
                    </details>
                    <p style="color: #94a3b8; font-size: 0.9em; margin-top: 20px;">
                        💡 참고: 이 이미지는 데모용입니다. 실제 배포 시 GenSpark image_generation API를 연동하면 자동으로 생성됩니다.
                    </p>
                `;
                
            } catch (error) {
                console.error('에러:', error);
                result.innerHTML = `<h2>❌ 에러</h2><p>${error.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
