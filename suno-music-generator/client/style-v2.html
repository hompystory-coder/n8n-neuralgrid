<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 스타일로 생성 V2 - YouTube 최적화</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      color: white;
      text-align: center;
    }
    
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 15px;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    
    .feature {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    
    .feature-icon {
      font-size: 2em;
      margin-bottom: 8px;
    }
    
    .main-panel {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      font-size: 1.1em;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 15px;
      font-size: 1em;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      transition: all 0.3s;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }
    
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.2em;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 12px;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎵 스타일로 생성 V2</h1>
      <p style="font-size: 1.2em; opacity: 0.9;">YouTube 최적화 버전 - 수익 극대화!</p>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon">⏱️</div>
          <div>곡 길이 최적화</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🎨</div>
          <div>썸네일 브랜드 통일</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🔍</div>
          <div>SEO 최적화</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🎯</div>
          <div>Temperature 제어</div>
        </div>
      </div>
    </div>
    
    <!-- Main Panel -->
    <div class="main-panel">
      <form id="generateForm">
        <!-- 스타일 입력 -->
        <div class="form-group">
          <label for="styleInput">🎵 음악 스타일 설명</label>
          <textarea 
            id="styleInput" 
            placeholder="예: 차분한 로파이 힙합, 공부할 때 듣기 좋은 음악"
            required></textarea>
        </div>
        
        <!-- 언어 선택 -->
        <div class="form-group">
          <label for="language">🌐 가사 언어</label>
          <select id="language">
            <option value="korean">한국어</option>
            <option value="english">영어</option>
          </select>
        </div>
        
        <!-- 목표 곡 길이 (NEW!) -->
        <div class="form-group">
          <label for="targetDuration">⏱️ 목표 곡 길이 (YouTube 최적화)</label>
          <select id="targetDuration">
            <option value="short">짧게 (3분) - 개별 곡</option>
            <option value="medium" selected>중간 (10분) - 플레이리스트용 ⭐</option>
            <option value="long">길게 (1시간) - 24/7 스트림용</option>
          </select>
        </div>
        
        <!-- 생성 개수 -->
        <div class="form-group">
          <label for="count">🔢 생성 개수</label>
          <input type="number" id="count" value="1" min="1" max="10">
        </div>
        
        <!-- ✨ NEW: 고급 옵션 섹션 -->
        <div class="form-group">
          <label style="font-size: 1.2em; color: #667eea; margin-bottom: 15px; display: flex; align-items: center;">
            🎛️ 고급 음악 제어 옵션
            <span style="font-size: 0.8em; color: #999; margin-left: 10px; font-weight: normal;">(선택사항)</span>
          </label>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px;">
            
            <!-- 볼륨/음량 제어 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px solid #e9ecef;">
              <div style="font-weight: 600; margin-bottom: 10px; color: #495057;">
                🔇 볼륨 제어
              </div>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionSoftVolume" style="width: auto; margin-right: 8px;">
                <span>조용한 볼륨 (Soft Volume)</span>
              </label>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionNoLoudDrums" style="width: auto; margin-right: 8px;">
                <span>시끄러운 드럼 제거</span>
              </label>
              <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionNoHeavyBass" style="width: auto; margin-right: 8px;">
                <span>강한 베이스 제거</span>
              </label>
            </div>
            
            <!-- 악기 스타일 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px solid #e9ecef;">
              <div style="font-weight: 600; margin-bottom: 10px; color: #495057;">
                🎸 악기 스타일
              </div>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionAcoustic" style="width: auto; margin-right: 8px;">
                <span>어쿠스틱 기타 추가</span>
              </label>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionSoftPiano" style="width: auto; margin-right: 8px;">
                <span>부드러운 피아노</span>
              </label>
              <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionGentleStrings" style="width: auto; margin-right: 8px;">
                <span>부드러운 현악기</span>
              </label>
            </div>
            
            <!-- 분위기 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px solid #e9ecef;">
              <div style="font-weight: 600; margin-bottom: 10px; color: #495057;">
                🌟 분위기
              </div>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionRelaxed" style="width: auto; margin-right: 8px;">
                <span>편안한 (Relaxed)</span>
              </label>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionCalm" style="width: auto; margin-right: 8px;">
                <span>고요한 (Calm)</span>
              </label>
              <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionPeaceful" style="width: auto; margin-right: 8px;">
                <span>평화로운 (Peaceful)</span>
              </label>
            </div>
            
            <!-- 특수 효과 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px solid #e9ecef;">
              <div style="font-weight: 600; margin-bottom: 10px; color: #495057;">
                ✨ 특수 효과
              </div>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionNatureSound" style="width: auto; margin-right: 8px;">
                <span>자연 소리 (새, 바람)</span>
              </label>
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionCampfire" style="width: auto; margin-right: 8px;">
                <span>캠프파이어 분위기</span>
              </label>
              <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="optionRainSound" style="width: auto; margin-right: 8px;">
                <span>빗소리 배경음</span>
              </label>
            </div>
            
          </div>
          
          <!-- 선택된 옵션 미리보기 -->
          <div id="selectedOptionsPreview" style="margin-top: 15px; padding: 15px; background: #e7f3ff; border-radius: 12px; border: 2px dashed #667eea; display: none;">
            <div style="font-weight: 600; color: #667eea; margin-bottom: 8px;">📋 선택된 옵션:</div>
            <div id="selectedOptionsText" style="color: #495057; line-height: 1.6;"></div>
          </div>
        </div>
        
        <!-- 생성 버튼 -->
        <button type="submit" class="btn" id="generateBtn">
          ✨ 최적화된 곡 생성하기
        </button>
      </form>
      
      <!-- 상태 메시지 -->
      <div id="status" class="status"></div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('generateForm');
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    
    // 테스트: API 연결 확인
    async function testConnection() {
      try {
        const response = await fetch('/api/style-v2/test');
        const data = await response.json();
        console.log('✅ API 연결 성공:', data);
      } catch (error) {
        console.error('❌ API 연결 실패:', error);
      }
    }
    
    // 페이지 로드 시 테스트
    testConnection();
    
    // ✨ 옵션 선택 실시간 미리보기
    const optionCheckboxes = [
      'optionSoftVolume', 'optionNoLoudDrums', 'optionNoHeavyBass',
      'optionAcoustic', 'optionSoftPiano', 'optionGentleStrings',
      'optionRelaxed', 'optionCalm', 'optionPeaceful',
      'optionNatureSound', 'optionCampfire', 'optionRainSound'
    ];
    
    const optionLabels = {
      optionSoftVolume: '🔇 조용한 볼륨',
      optionNoLoudDrums: '🥁 시끄러운 드럼 제거',
      optionNoHeavyBass: '🎸 강한 베이스 제거',
      optionAcoustic: '🎸 어쿠스틱 기타',
      optionSoftPiano: '🎹 부드러운 피아노',
      optionGentleStrings: '🎻 부드러운 현악기',
      optionRelaxed: '😌 편안한 분위기',
      optionCalm: '🧘 고요한 분위기',
      optionPeaceful: '☮️ 평화로운 분위기',
      optionNatureSound: '🌿 자연 소리',
      optionCampfire: '🔥 캠프파이어 분위기',
      optionRainSound: '🌧️ 빗소리 배경음'
    };
    
    function updateOptionsPreview() {
      const selectedOptions = [];
      optionCheckboxes.forEach(id => {
        const checkbox = document.getElementById(id);
        if (checkbox && checkbox.checked) {
          selectedOptions.push(optionLabels[id]);
        }
      });
      
      const preview = document.getElementById('selectedOptionsPreview');
      const previewText = document.getElementById('selectedOptionsText');
      
      if (selectedOptions.length > 0) {
        preview.style.display = 'block';
        previewText.innerHTML = selectedOptions.join('<br>');
      } else {
        preview.style.display = 'none';
      }
    }
    
    // 모든 체크박스에 이벤트 리스너 추가
    optionCheckboxes.forEach(id => {
      const checkbox = document.getElementById(id);
      if (checkbox) {
        checkbox.addEventListener('change', updateOptionsPreview);
      }
    });
    
    // 폼 제출
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const styleInput = document.getElementById('styleInput').value;
      const language = document.getElementById('language').value;
      const targetDuration = document.getElementById('targetDuration').value;
      const count = parseInt(document.getElementById('count').value);
      
      // ✨ 선택된 옵션 수집
      const options = {};
      optionCheckboxes.forEach(id => {
        const checkbox = document.getElementById(id);
        if (checkbox) {
          options[id] = checkbox.checked;
        }
      });
      
      btn.disabled = true;
      btn.textContent = '⏳ 생성 중...';
      status.className = 'status';
      status.style.display = 'none';
      
      try {
        const response = await fetch('/api/style-v2/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            styleInput,
            language,
            targetDuration,
            count,
            options  // ✨ 옵션 추가!
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          status.className = 'status success show';
          status.innerHTML = `
            <h3>✅ 요청 성공!</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          throw new Error(data.error || '생성 실패');
        }
        
      } catch (error) {
        status.className = 'status error show';
        status.innerHTML = `
          <h3>❌ 오류 발생</h3>
          <p>${error.message}</p>
        `;
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ 최적화된 곡 생성하기';
      }
    });
  </script>
</body>
</html>
