<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖼️ 이미지 업스케일 테스트</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    .test-box {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }
    
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .image-card {
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    
    .image-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border-color: #667eea;
    }
    
    .image-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    
    .image-info {
      padding: 15px;
      background: #f5f5f5;
    }
    
    .image-info h3 {
      margin-bottom: 8px;
      color: #333;
      font-size: 1.1em;
    }
    
    .image-info p {
      color: #666;
      font-size: 0.9em;
    }
    
    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      font-weight: 600;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 1.2em;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
      font-size: 2em;
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 1000px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .modal-header h2 {
      color: #667eea;
      font-size: 1.8em;
    }
    
    .close-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
    }
    
    .close-btn:hover {
      background: #dc2626;
    }
    
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .result-card {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .result-card img {
      width: 100%;
      height: auto;
    }
    
    .result-card h3 {
      padding: 15px;
      background: #f5f5f5;
      margin: 0;
      color: #333;
    }
    
    .download-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ 이미지 업스케일 테스트</h1>
    
    <div class="test-box">
      <h2 style="margin-bottom: 20px; color: #333;">📋 테스트 방법</h2>
      <ol style="color: #666; line-height: 1.8;">
        <li>아래 이미지 중 하나를 클릭하세요</li>
        <li>업스케일 진행 상태를 확인하세요</li>
        <li>완료되면 고화질 이미지 2종이 표시됩니다</li>
        <li>각 이미지를 다운로드할 수 있습니다</li>
      </ol>
    </div>
    
    <div class="test-box">
      <h2 style="margin-bottom: 20px; color: #333;">🎵 생성된 곡 (이미지 클릭 시 업스케일)</h2>
      <div id="loading" class="loading">
        <div class="spinner">⏳</div>
        <p>생성된 곡 불러오는 중...</p>
      </div>
      <div id="imageGrid" class="image-grid" style="display: none;"></div>
    </div>
  </div>
  
  <script>
    const BASE_URL = window.location.origin;
    
    // 생성된 곡 불러오기
    async function loadSongs() {
      try {
        const response = await fetch(`${BASE_URL}/api/style/list-completed`);
        if (!response.ok) throw new Error('Failed to load songs');
        
        const data = await response.json();
        const songs = data.songs || [];
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('imageGrid').style.display = 'grid';
        
        if (songs.length === 0) {
          document.getElementById('imageGrid').innerHTML = '<p style="color: #666; text-align: center;">생성된 곡이 없습니다.</p>';
          return;
        }
        
        // 이미지가 있는 곡만 표시
        const songsWithImages = songs.filter(s => s.imageUrl);
        
        document.getElementById('imageGrid').innerHTML = songsWithImages.map(song => `
          <div class="image-card" onclick="handleImageClick('${song.imageUrl}', '${song.title || 'Untitled'}', '${song.style || ''}', '${(song.lyrics || '').replace(/'/g, "\\'")}')">
            <div class="status">🖼️ 클릭하여 업스케일</div>
            <img src="${song.imageUrl}" alt="${song.title}">
            <div class="image-info">
              <h3>🎵 ${song.title || 'Untitled'}</h3>
              <p>${song.style ? song.style.substring(0, 80) + '...' : ''}</p>
            </div>
          </div>
        `).join('');
        
      } catch (error) {
        console.error('Error loading songs:', error);
        document.getElementById('loading').innerHTML = '<p style="color: #ef4444;">❌ 곡 불러오기 실패</p>';
      }
    }
    
    // 이미지 클릭 시 업스케일
    async function handleImageClick(imageUrl, title, style, lyrics) {
      // 클릭한 카드 찾기
      const card = event.currentTarget;
      const statusDiv = card.querySelector('.status');
      const originalHTML = statusDiv.innerHTML;
      
      // 업스케일 시작
      statusDiv.innerHTML = '<span class="spinner">✨</span> 업스케일 중...';
      
      try {
        console.log('🖼️ 업스케일 시작:', title);
        
        const response = await fetch(`${BASE_URL}/api/style/upscale-image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageUrl: imageUrl,
            title: title,
            style: style,
            lyrics: lyrics
          })
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || '업스케일 실패');
        }
        
        const data = await response.json();
        console.log('✅ 업스케일 완료:', data);
        
        // 완료 표시
        statusDiv.innerHTML = '✅ 업스케일 완료!';
        statusDiv.style.background = 'rgba(34,197,94,0.9)';
        
        // 결과 모달 표시
        showResultModal({
          title: title,
          youtubeUrl: data.youtubeUrl,
          albumUrl: data.albumUrl,
          originalUrl: imageUrl
        });
        
        // 3초 후 원래 상태로
        setTimeout(() => {
          statusDiv.innerHTML = originalHTML;
          statusDiv.style.background = 'rgba(0,0,0,0.8)';
        }, 3000);
        
      } catch (error) {
        console.error('❌ 업스케일 실패:', error);
        statusDiv.innerHTML = '❌ 실패';
        statusDiv.style.background = 'rgba(239,68,68,0.9)';
        alert(`❌ 업스케일 실패: ${error.message}`);
        
        setTimeout(() => {
          statusDiv.innerHTML = originalHTML;
          statusDiv.style.background = 'rgba(0,0,0,0.8)';
        }, 3000);
      }
    }
    
    // 결과 모달 표시
    function showResultModal(data) {
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <h2>✨ ${data.title}</h2>
            <button class="close-btn" onclick="this.closest('.modal').remove()">✕ 닫기</button>
          </div>
          
          <div class="result-grid">
            <div class="result-card">
              <h3>📺 YouTube 썸네일 (1280×720)</h3>
              <img src="${data.youtubeUrl}" alt="YouTube Thumbnail">
              <button class="download-btn" onclick="downloadImage('${data.youtubeUrl}', '${data.title}_youtube.jpg')">
                📥 다운로드
              </button>
            </div>
            
            <div class="result-card">
              <h3>💿 앨범 커버 (3000×3000)</h3>
              <img src="${data.albumUrl}" alt="Album Cover">
              <button class="download-btn" onclick="downloadImage('${data.albumUrl}', '${data.title}_album.jpg')">
                📥 다운로드
              </button>
            </div>
          </div>
          
          <div style="margin-top: 20px; padding: 20px; background: #f5f5f5; border-radius: 12px;">
            <h4 style="margin-bottom: 10px; color: #666;">🔍 원본 이미지 (360×360)</h4>
            <img src="${data.originalUrl}" style="width: 180px; border-radius: 8px;">
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
    }
    
    // 이미지 다운로드
    function downloadImage(url, filename) {
      fetch(url)
        .then(response => response.blob())
        .then(blob => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
          URL.revokeObjectURL(link.href);
          console.log('✅ 다운로드 시작:', filename);
        })
        .catch(error => {
          console.error('다운로드 실패:', error);
          alert('❌ 다운로드 실패');
        });
    }
    
    // 페이지 로드 시 곡 불러오기
    loadSongs();
  </script>
</body>
</html>
